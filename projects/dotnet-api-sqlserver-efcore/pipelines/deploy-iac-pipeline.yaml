parameters:
  - name: deployEnvironment
    type: string
  - name: location
    type: string

steps:
  - checkout: none

  - task: DownloadPipelineArtifact@2
    displayName: Download infrastructure artifact
    inputs:
      source: current
      artifact: iac
      path: $(Pipeline.Workspace)/iac

  - task: AzureCLI@2
    displayName: Create resource group if missing
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az group create \
          --name "$(resourceGroupName)" \
          --location "${{ parameters.location }}" \
          --tags Environment="${{ parameters.deployEnvironment }}"

  - task: AzureCLI@2
    displayName: Deploy Bicep infrastructure
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        if [ -z "$SQL_ADMIN_PASSWORD" ] || [ "${SQL_ADMIN_PASSWORD:0:2}" = '$(' ]; then
          echo "Set the sqlAdministratorLoginPassword secret pipeline variable."
          exit 1
        fi

        az deployment group create \
          --name "$(bicepDeploymentName)" \
          --mode Incremental \
          --resource-group "$(resourceGroupName)" \
          --template-file "$(Pipeline.Workspace)/iac/main.bicep" \
          --parameters "$(Pipeline.Workspace)/iac/parameters/$(parameterFile)" \
          location="${{ parameters.location }}" \
          env="${{ parameters.deployEnvironment }}"
    env:
      SQL_ADMIN_PASSWORD: $(sqlAdministratorLoginPassword)

  - task: AzureCLI@2
    displayName: Verify infrastructure deployment
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        provisioningState=$(az deployment group show \
          --resource-group "$(resourceGroupName)" \
          --name "$(bicepDeploymentName)" \
          --query properties.provisioningState \
          --output tsv)

        echo "Provisioning state: ${provisioningState}"
        if [ "${provisioningState}" != "Succeeded" ]; then
          echo "Infrastructure deployment failed."
          exit 1
        fi

        webAppUrl=$(az deployment group show \
          --resource-group "$(resourceGroupName)" \
          --name "$(bicepDeploymentName)" \
          --query properties.outputs.webAppUrl.value \
          --output tsv)
        if [ -z "${webAppUrl}" ]; then
          echo "Web App URL was not returned by the infrastructure deployment."
          exit 1
        fi
        echo "Order API Web App URL: ${webAppUrl}"
