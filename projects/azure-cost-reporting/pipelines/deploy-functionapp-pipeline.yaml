steps:
  - checkout: none

  - task: DownloadPipelineArtifact@2
    displayName: Download Function App artifact
    inputs:
      source: current
      artifact: functionapp
      path: $(Pipeline.Workspace)/functionapp

  - task: AzureFunctionApp@2
    displayName: Deploy .NET isolated Function App
    inputs:
      azureSubscription: $(serviceConnection)
      appType: functionAppLinux
      appName: $(functionAppName)
      package: $(Pipeline.Workspace)/functionapp/functionapp.zip
      runtimeStack: DOTNET-ISOLATED|8.0
      deploymentMethod: runFromPackage
